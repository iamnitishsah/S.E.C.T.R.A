[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sectra"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests", "pyyaml", "python-dotenv", "sqlalchemy", "pymysql", "cryptography", "beautifulsoup4", "lxml"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]