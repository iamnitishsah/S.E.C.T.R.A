[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sectra"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["requests", "pyyaml", "python-dotenv", "sqlalchemy", "pymysql", "cryptography", "lxml", "numpy", "transformers", "qdrant-client==1.18.0", "openai", "sqlglot>=25"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]