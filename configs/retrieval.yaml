index_items: ["1", "1A", "1C", "3", "7", "7A"]

chunking:
  target_tokens: 350     # body size; bge reads at most 512 tokens
  overlap_tokens: 50     # whole lines carried into the next chunk
  max_tokens: 480        # alarm threshold incl. header (target + overlap + header)

embedding:
  model: BAAI/bge-base-en-v1.5
  query_instruction: "Represent this sentence for searching relevant passages: "
  batch_size: 32

vector_store:
  collection: sec_chunks
  top_k: 5
  min_score: 0.5