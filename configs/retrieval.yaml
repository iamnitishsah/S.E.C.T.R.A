index_items: ["1", "1A", "1C", "3", "7", "7A"]

chunking:
  tokenizer: BAAI/bge-base-en-v1.5
  target_tokens: 350
  overlap_tokens: 50
  max_tokens: 480

embedding:
  url: https://integrate.api.nvidia.com/v1/embeddings
  model: nvidia/nemotron-3.5-embed-8b
  api_key_env: NVIDIA_API_KEY
  dimensions: 1024
  batch_size: 32
  doc_input_type: passage
  query_input_type: query
  workers: 2

vector_store:
  collection: sec_chunks
  top_k: 5
  min_score: 0.5

bm25:
  k1: 1.2                # term-frequency saturation
  b: 0.75                # length normalisation

hybrid:
  candidates: 30         # taken from dense and from BM25 before fusion
  rrf_k: 60              # RRF constant: larger = flatter weighting of ranks

rerank:
  url: https://ai.api.nvidia.com/v1/retrieval/nvidia/nemotron-3.5-rerank-8b/reranking
  model: nvidia/nemotron-3.5-rerank-8b
  api_key_env: NVIDIA_API_KEY