# Production (one EC2 instance): the API and Qdrant. MySQL is on RDS and is reached through
# MYSQL_HOST / MYSQL_PORT in .env.
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f api

services:
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: sectra-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"     # reachable only from the instance itself (use an SSH tunnel to load vectors)
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    image: sectra-api
    container_name: sectra-api
    restart: unless-stopped
    env_file: .env                # RDS endpoint, credentials and API keys; never committed
    environment:
      QDRANT_URL: http://qdrant:6333
    ports:
      - "8000:8000"
    volumes:
      - api_logs:/app/data/logs
    depends_on:
      - qdrant
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  qdrant_data:
  api_logs: